<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IgnitionBench — Projects</title>
<script>
document.documentElement.dataset.theme =
  localStorage.getItem("ib-theme") ||
  (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
</script>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
</head>
<body>
<header>
  <div class="brand">
    <div>
      <img class="logo-full" data-logo="{{ url_for('static', filename='logo-full.png') }}"
           src="{{ url_for('static', filename='logo-full.png') }}" alt="IgnitionBench">
      <p>Solid rocket motor design studio</p>
    </div>
  </div>
  <div class="header-right">
    <button class="btn theme-toggle" id="themeToggle" title="Switch theme">☀</button>
    <button class="btn primary" id="newProjectBtn">+ New project</button>
  </div>
</header>

<main class="home">
  <div class="empty-state" id="emptyState" hidden>
    <img class="empty-logo" data-logo="{{ url_for('static', filename='logo-full.png') }}"
         src="{{ url_for('static', filename='logo-full.png') }}" alt="">
    <h2>No projects yet</h2>
    <p>Start your first motor — pick a propellant, shape the grain, and watch it burn.</p>
    <button class="btn primary" id="emptyNewBtn">Start your first motor</button>
  </div>
  <div class="project-grid" id="projectGrid"></div>
</main>

<div class="modal-overlay" id="modal" hidden>
  <div class="modal">
    <h2>New project</h2>
    <label for="projectName">Project name</label>
    <input id="projectName" type="text" placeholder="e.g. 54 mm KNSB J-motor" maxlength="60" autocomplete="off">
    <div class="modal-actions">
      <button class="btn" id="modalCancel">Cancel</button>
      <button class="btn primary" id="modalCreate">Create</button>
    </div>
  </div>
</div>

<button class="ai-side-tab" id="aiTab" title="Ask the SRM mentor">✦ AI mentor</button>
<aside class="ai-drawer" id="aiDrawer" hidden>
  <div class="ai-head">
    <h2>SRM mentor</h2>
    <button class="btn small" id="aiClose">✕</button>
  </div>
  <div class="ai-messages" id="aiMessages"></div>
  <form class="ai-input" id="aiForm">
    <textarea id="aiText" rows="2"
      placeholder="Ask about rocketry, safety, or the design process…"></textarea>
    <button class="btn primary" id="aiSend" type="submit">Send</button>
  </form>
</aside>

<script src="{{ url_for('static', filename='theme.js') }}"></script>
<script src="{{ url_for('static', filename='ai.js') }}"></script>
<script src="{{ url_for('static', filename='home.js') }}"></script>
</body>
</html>
