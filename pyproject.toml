[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ignitionbench"
version = "0.1.0"
description = "AI-powered rocket motor design software for hobbyist rocketeers"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "anthropic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "flask",
]
web = [
    "flask",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
